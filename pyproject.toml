[project]
name = "saras"
version = "0.2.0"
description = "SARAS — a modular, tool-based personal AI desktop agent for Windows."
requires-python = ">=3.10"
readme = "README.md"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
